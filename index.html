<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador de cartas Magic</title>
<meta name="description" content="Busca cualquier carta de Magic: The Gathering por nombre y consulta su precio.">
<style>
  :root {
    --bg: #14161b;
    --panel: #1e2129;
    --panel-2: #272b35;
    --text: #eceef2;
    --muted: #9aa1ae;
    --accent: #e0a526;
    --border: #343946;
    --good: #6fcf97;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f2ee;
      --panel: #ffffff;
      --panel-2: #f0ede7;
      --text: #1d1f24;
      --muted: #666c78;
      --accent: #a86b00;
      --border: #dcd8cf;
      --good: #1d7a46;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
  }
  .bar {
    max-width: 1300px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  h1 {
    font-size: 1.15rem;
    margin: 0 8px 0 0;
    white-space: nowrap;
  }
  h1 span { color: var(--accent); }
  input[type="search"], select {
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .search { position: relative; flex: 1 1 240px; min-width: 0; }
  input[type="search"] { width: 100%; }
  #sug {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 6px);
    z-index: 6;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 14px 36px rgba(0, 0, 0, .4);
    overflow: hidden;
    animation: sug-in .14s ease-out;
  }
  #sug[hidden] { display: none; }
  @keyframes sug-in { from { opacity: 0; transform: translateY(-6px); } }
  #sugList {
    margin: 0;
    padding: 6px;
    list-style: none;
    max-height: 330px;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #sugList li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-left: 3px solid transparent;
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    transition: background .1s, border-color .1s, padding-left .1s;
  }
  #sugList .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sugList b { color: var(--text); font-weight: 600; }
  #sugList .go { opacity: 0; color: var(--accent); font-size: .75rem; white-space: nowrap; transition: opacity .1s; }
  #sugList li.on { background: var(--panel-2); border-left-color: var(--accent); padding-left: 14px; color: var(--text); }
  #sugList li.on b { color: var(--accent); }
  #sugList li.on .go { opacity: 1; }
  #sugPreview { display: none; width: 190px; padding: 10px; border-left: 1px solid var(--border); background: var(--panel-2); }
  #sugPreview img { width: 100%; aspect-ratio: 488 / 680; border-radius: 4.75% / 3.5%; display: block; opacity: 0; transition: opacity .15s; }
  #sugPreview img.ready { opacity: 1; }
  @media (min-width: 720px) { #sugPreview { display: block; } }
  #sugFoot {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 12px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: .75rem;
  }
  @media (prefers-reduced-motion: reduce) {
    #sug { animation: none; }
    #sugList li, #sugList .go, #sugPreview img { transition: none; }
  }
  input[type="search"]:focus, select:focus, button:focus-visible, .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  main { max-width: 1300px; margin: 0 auto; padding: 16px; }
  #status { color: var(--muted); margin: 0 0 14px; min-height: 1.4em; }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    cursor: pointer;
    text-align: left;
    color: inherit;
    font: inherit;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card img, .card .noimg {
    width: 100%;
    aspect-ratio: 488 / 680;
    border-radius: 4.75% / 3.5%;
    background: var(--panel-2);
    display: block;
    object-fit: cover;
  }
  .card .noimg {
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: .85rem;
    padding: 8px;
    text-align: center;
  }
  .card .name { font-weight: 600; font-size: .92rem; overflow-wrap: anywhere; }
  .card .set { color: var(--muted); font-size: .78rem; }
  .prices { display: flex; gap: 10px; font-size: .9rem; font-variant-numeric: tabular-nums; margin-top: auto; }
  .prices b { color: var(--good); }
  .prices .none { color: var(--muted); }
  #more { display: flex; justify-content: center; padding: 24px 0 8px; }
  button.plain {
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
  }
  button.plain:hover { border-color: var(--accent); }
  footer {
    max-width: 1300px;
    margin: 0 auto;
    padding: 20px 16px 32px;
    color: var(--muted);
    font-size: .78rem;
  }
  footer a, .links a { color: var(--accent); }

  dialog {
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--panel);
    color: var(--text);
    padding: 0;
    width: min(820px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .65); }
  .detail { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; padding: 20px; }
  @media (max-width: 640px) { .detail { grid-template-columns: 1fr; } }
  .detail img.main { width: 100%; aspect-ratio: 488 / 680; border-radius: 4.75% / 3.5%; display: block; background: var(--panel-2); }
  .caption { color: var(--muted); font-size: .8rem; margin: 6px 0 0; min-height: 1.2em; }
  .arts { display: flex; flex-wrap: wrap; gap: 6px; max-height: 176px; overflow-y: auto; padding: 8px 0 2px; }
  .arts button { flex: 0 0 52px; padding: 0; border: 2px solid transparent; border-radius: 6px; background: none; cursor: pointer; }
  .arts button.on { border-color: var(--accent); }
  .arts img { width: 100%; aspect-ratio: 488 / 680; display: block; border-radius: 4px; background: var(--panel-2); }
  .editions tr.pick { cursor: pointer; }
  .editions tr.pick:hover td { color: var(--accent); }
  .detail h2 { margin: 0 0 2px; font-size: 1.3rem; overflow-wrap: anywhere; }
  .detail .type { color: var(--muted); margin: 0 0 12px; }
  .detail .oracle { white-space: pre-wrap; margin: 0 0 14px; font-size: .95rem; }
  .detail table { border-collapse: collapse; width: 100%; margin-bottom: 14px; font-variant-numeric: tabular-nums; }
  .detail td { padding: 6px 0; border-bottom: 1px solid var(--border); }
  .detail td:last-child { text-align: right; font-weight: 600; }
  .links { display: flex; flex-wrap: wrap; gap: 14px; font-size: .92rem; margin-bottom: 14px; }
  .close-row { display: flex; justify-content: flex-end; }
  .editions h3 { font-size: 1rem; margin: 0 0 2px; }
  .editions .type { margin-bottom: 6px; font-size: .85rem; }
  .editions .scroll { max-height: 260px; overflow: auto; margin-bottom: 14px; border-top: 1px solid var(--border); }
  .editions table { margin: 0; font-size: .88rem; }
  .editions th { text-align: left; font-weight: 600; color: var(--muted); padding: 6px 0; position: sticky; top: 0; background: var(--panel); }
  .editions th:not(:first-child), .editions td:not(:first-child) { text-align: right; padding-left: 12px; white-space: nowrap; }
  .editions td:not(:first-child) { font-weight: 600; }
  .editions td small { color: var(--muted); font-weight: 400; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Cartas <span>Magic</span></h1>
    <div class="search">
      <input id="q" type="search" placeholder="Busca por nombre (en inglés), p. ej. Lightning Bolt" autocomplete="off" autofocus aria-label="Buscar carta por nombre" aria-autocomplete="list" aria-controls="sug">
      <div id="sug" hidden>
        <ul id="sugList" role="listbox" aria-label="Sugerencias"></ul>
        <div id="sugPreview" aria-hidden="true"></div>
        <div id="sugFoot"></div>
      </div>
    </div>
    <select id="sort" aria-label="Ordenar por">
      <option value="name:asc">Nombre (A–Z)</option>
      <option value="eur:desc">Precio: de mayor a menor</option>
      <option value="eur:asc">Precio: de menor a mayor</option>
      <option value="released:desc">Más recientes</option>
    </select>
  </div>
</header>

<main>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="grid"></div>
  <div id="more"></div>
</main>

<footer>
  Datos, imágenes y precios servidos por <a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a>
  (precios orientativos de Cardmarket en € y TCGplayer en $, actualizados a diario).
  Página no oficial de fans: Magic: The Gathering es propiedad de Wizards of the Coast, que no la respalda ni patrocina.
</footer>

<dialog id="dlg" aria-labelledby="dlg-name"></dialog>

<script>
(function () {
  'use strict';

  var API = 'https://api.scryfall.com/cards/search';
  var $q = document.getElementById('q');
  var $sort = document.getElementById('sort');
  var $grid = document.getElementById('grid');
  var $status = document.getElementById('status');
  var $more = document.getElementById('more');
  var $dlg = document.getElementById('dlg');
  var $sug = document.getElementById('sug');
  var AUTO = 'https://api.scryfall.com/cards/autocomplete';
  var exact = false;    // la búsqueda viene de una sugerencia: nombre exacto

  var eur = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });
  var usd = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'USD' });
  var num = new Intl.NumberFormat('es-ES');

  var nextUrl = null;   // siguiente página de resultados, si la hay
  var loading = false;
  var token = 0;        // descarta respuestas de búsquedas antiguas
  var shown = 0;
  var total = 0;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function image(card, size) {
    if (card.image_uris) return card.image_uris[size];
    if (card.card_faces && card.card_faces[0].image_uris) return card.card_faces[0].image_uris[size];
    return null;
  }

  function money(fmt, value) {
    return value == null ? null : fmt.format(Number(value));
  }

  function firstUrl() {
    var parts = $sort.value.split(':');
    var text = $q.value.trim();
    var query = text || 'game:paper';
    if (text && exact && text.indexOf('"') < 0) query = '!"' + text + '"';
    var params = new URLSearchParams({
      q: query,
      unique: 'cards',
      order: parts[0],
      dir: parts[1]
    });
    return API + '?' + params.toString();
  }

  function renderCard(card) {
    var b = el('button', 'card');
    b.type = 'button';
    var src = image(card, 'normal');
    if (src) {
      var img = el('img');
      img.loading = 'lazy';
      img.alt = '';
      img.src = src;
      b.appendChild(img);
    } else {
      b.appendChild(el('div', 'noimg', 'Sin imagen'));
    }
    b.appendChild(el('div', 'name', card.name));
    b.appendChild(el('div', 'set', card.set_name));

    var p = el('div', 'prices');
    var e = money(eur, card.prices.eur || card.prices.eur_foil);
    var u = money(usd, card.prices.usd || card.prices.usd_foil);
    if (e) p.appendChild(el('b', null, e));
    if (u) p.appendChild(el('span', null, u));
    if (!e && !u) p.appendChild(el('span', 'none', 'Sin precio'));
    b.appendChild(p);

    b.addEventListener('click', function () { openDetail(card); });
    return b;
  }

  function openDetail(card) {
    $dlg.textContent = '';
    var wrap = el('div', 'detail');

    var left = el('div');
    var img = el('img', 'main');
    img.alt = card.name;
    var src = image(card, 'large') || image(card, 'normal');
    if (src) img.src = src;
    left.appendChild(img);
    var caption = el('p', 'caption', artCaption(card));
    left.appendChild(caption);
    var arts = el('div', 'arts');
    left.appendChild(arts);
    wrap.appendChild(left);

    var right = el('div');
    var h = el('h2', null, card.name);
    h.id = 'dlg-name';
    right.appendChild(h);
    right.appendChild(el('p', 'type', [card.type_line, card.set_name, card.rarity].filter(Boolean).join(' · ')));

    var text = card.oracle_text;
    if (text == null && card.card_faces) {
      text = card.card_faces.map(function (f) { return f.name + '\n' + (f.oracle_text || ''); }).join('\n\n');
    }
    if (text) right.appendChild(el('p', 'oracle', text));

    var rows = [
      ['Cardmarket', money(eur, card.prices.eur)],
      ['Cardmarket (foil)', money(eur, card.prices.eur_foil)],
      ['TCGplayer', money(usd, card.prices.usd)],
      ['TCGplayer (foil)', money(usd, card.prices.usd_foil)],
      ['Magic Online (tix)', card.prices.tix == null ? null : num.format(Number(card.prices.tix))]
    ].filter(function (r) { return r[1]; });

    if (rows.length) {
      var table = el('table');
      rows.forEach(function (r) {
        var tr = el('tr');
        tr.appendChild(el('td', null, r[0]));
        tr.appendChild(el('td', null, r[1]));
        table.appendChild(tr);
      });
      right.appendChild(table);
    } else {
      right.appendChild(el('p', 'type', 'No hay precios disponibles para esta carta.'));
    }

    var links = el('div', 'links');
    var buy = card.purchase_uris || {};
    [['Ver en Scryfall', card.scryfall_uri], ['Comprar en Cardmarket', buy.cardmarket], ['Comprar en TCGplayer', buy.tcgplayer]]
      .forEach(function (l) {
        if (!l[1] || !/^https:\/\//.test(l[1])) return;
        var a = el('a', null, l[0]);
        a.href = l[1];
        a.target = '_blank';
        a.rel = 'noopener';
        links.appendChild(a);
      });
    right.appendChild(links);

    var eds = el('div', 'editions');
    eds.appendChild(el('h3', null, 'Precios por edición'));
    var edStatus = el('p', 'type', 'Cargando ediciones…');
    eds.appendChild(edStatus);
    right.appendChild(eds);
    loadPrints(card, eds, edStatus, img, caption, arts);

    var row = el('div', 'close-row');
    var close = el('button', 'plain', 'Cerrar');
    close.type = 'button';
    close.addEventListener('click', function () { $dlg.close(); });
    row.appendChild(close);
    right.appendChild(row);

    wrap.appendChild(right);
    $dlg.appendChild(wrap);
    $dlg.showModal();
  }

  var printsToken = 0;  // descarta la respuesta si se abre otra carta antes

  function priceCell(fmt, normal, foil) {
    var td = el('td');
    if (normal != null) {
      td.textContent = fmt.format(Number(normal));
    } else if (foil != null) {
      td.textContent = fmt.format(Number(foil)) + ' ';
      td.appendChild(el('small', null, 'foil'));
    } else {
      td.textContent = '—';
    }
    return td;
  }

  // Dos ediciones con la misma ilustración comparten clave.
  function artKey(p) {
    return p.illustration_id || (p.card_faces && p.card_faces[0].illustration_id) || p.id;
  }

  function artCaption(p) {
    return [p.set_name, p.artist ? 'Ilustración de ' + p.artist : ''].filter(Boolean).join(' · ');
  }

  async function loadPrints(card, box, status, img, caption, arts) {
    var mine = ++printsToken;
    var url = card.prints_search_uri;
    if (!url || !/^https:\/\/api\.scryfall\.com\//.test(url)) {
      status.textContent = 'No hay más ediciones disponibles.';
      return;
    }
    try {
      var res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      if (mine !== printsToken) return;

      var table = el('table');
      var head = el('tr');
      ['Edición', '€', '$'].forEach(function (t) { head.appendChild(el('th', null, t)); });
      table.appendChild(head);

      var thumbs = {};
      function pick(p) {
        var s = image(p, 'large') || image(p, 'normal');
        if (s) img.src = s;
        caption.textContent = artCaption(p);
        var k = artKey(p);
        Object.keys(thumbs).forEach(function (id) { thumbs[id].classList.toggle('on', id === k); });
      }

      data.data.forEach(function (p) {
        var k = artKey(p);
        var small = image(p, 'small');
        if (small && !thumbs[k]) {
          var b = el('button');
          b.type = 'button';
          b.title = artCaption(p);
          var t = el('img');
          t.loading = 'lazy';
          t.alt = 'Arte de ' + p.set_name;
          t.src = small;
          b.appendChild(t);
          b.addEventListener('click', function () { pick(p); });
          arts.appendChild(b);
          thumbs[k] = b;
        }
        var tr = el('tr', 'pick');
        tr.title = 'Ver esta edición';
        tr.addEventListener('click', function () { pick(p); });
        var name = el('td', null, p.set_name + ' ');
        var year = (p.released_at || '').slice(0, 4);
        name.appendChild(el('small', null, [year, '#' + p.collector_number].filter(Boolean).join(' · ')));
        tr.appendChild(name);
        tr.appendChild(priceCell(eur, p.prices.eur, p.prices.eur_foil));
        tr.appendChild(priceCell(usd, p.prices.usd, p.prices.usd_foil));
        table.appendChild(tr);
      });

      if (Object.keys(thumbs).length < 2) {
        arts.textContent = '';   // un solo arte: no hay nada que elegir
      } else if (thumbs[artKey(card)]) {
        thumbs[artKey(card)].classList.add('on');
      }

      var n = data.total_cards || data.data.length;
      status.textContent = n === 1 ? '1 edición' : num.format(n) + ' ediciones'
        + (data.has_more ? ' (se muestran las ' + data.data.length + ' más recientes)' : '');
      var scroll = el('div', 'scroll');
      scroll.appendChild(table);
      box.appendChild(scroll);
    } catch (err) {
      if (mine !== printsToken) return;
      status.textContent = 'No se han podido cargar las ediciones.';
      console.error(err);
    }
  }

  $dlg.addEventListener('click', function (ev) {
    if (ev.target === $dlg) $dlg.close();   // clic en el fondo
  });

  function setStatus() {
    $status.textContent = total
      ? 'Mostrando ' + num.format(shown) + ' de ' + num.format(total) + ' cartas'
      : '';
  }

  function showMore() {
    $more.textContent = '';
    if (!nextUrl) return;
    var b = el('button', 'plain', 'Cargar más cartas');
    b.type = 'button';
    b.addEventListener('click', function () { load(false); });
    $more.appendChild(b);
  }

  async function load(reset) {
    if (loading && !reset) return;
    var mine = ++token;
    var url = reset ? firstUrl() : nextUrl;
    if (!url) return;

    loading = true;
    if (reset) {
      nextUrl = null;
      shown = 0;
      total = 0;
      $grid.textContent = '';
      $more.textContent = '';
    }
    $status.textContent = 'Cargando…';

    try {
      var res = await fetch(url);
      if (mine !== token) return;

      if (res.status === 404) {
        $status.textContent = 'No se ha encontrado ninguna carta con ese nombre. Prueba con el nombre en inglés.';
        return;
      }
      if (res.status === 429) {
        $status.textContent = 'Demasiadas búsquedas seguidas. Espera unos segundos e inténtalo de nuevo.';
        return;
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);

      var data = await res.json();
      if (mine !== token) return;

      var frag = document.createDocumentFragment();
      data.data.forEach(function (c) { frag.appendChild(renderCard(c)); });
      $grid.appendChild(frag);

      shown += data.data.length;
      total = data.total_cards || shown;
      nextUrl = data.has_more ? data.next_page : null;
      setStatus();
      showMore();
    } catch (err) {
      if (mine !== token) return;
      $status.textContent = 'No se han podido cargar las cartas. Comprueba tu conexión e inténtalo de nuevo.';
      console.error(err);
    } finally {
      if (mine === token) loading = false;
    }
  }

  var timer;
  var sugTimer;
  var sugToken = 0;     // descarta sugerencias de un texto anterior
  var sugIndex = -1;    // sugerencia marcada con el teclado o el ratón
  var prevTimer;
  var $list = document.getElementById('sugList');
  var $prev = document.getElementById('sugPreview');
  var $foot = document.getElementById('sugFoot');
  var wide = window.matchMedia('(min-width: 720px)');   // solo ahí cabe la vista previa

  function closeSug() {
    sugToken++;
    clearTimeout(sugTimer);
    clearTimeout(prevTimer);
    $sug.hidden = true;
    $list.textContent = '';
    $prev.textContent = '';
    sugIndex = -1;
  }

  function chooseSug(name) {
    $q.value = name;
    exact = true;
    closeSug();
    clearTimeout(timer);
    load(true);
  }

  // Imagen de la carta sugerida, con un pequeño retardo para no pedir una por cada roce.
  function preview(name) {
    clearTimeout(prevTimer);
    if (!wide.matches) return;
    prevTimer = setTimeout(function () {
      var img = el('img');
      img.alt = '';
      img.addEventListener('load', function () { img.classList.add('ready'); });
      img.src = 'https://api.scryfall.com/cards/named?format=image&version=normal&exact=' + encodeURIComponent(name);
      $prev.textContent = '';
      $prev.appendChild(img);
    }, 180);
  }

  function markSug(i, scroll) {
    var items = $list.children;
    if (!items.length) return;
    var next = (i + items.length) % items.length;
    if (next === sugIndex) return;
    sugIndex = next;
    for (var j = 0; j < items.length; j++) {
      items[j].classList.toggle('on', j === sugIndex);
      items[j].setAttribute('aria-selected', j === sugIndex ? 'true' : 'false');
    }
    if (scroll) items[sugIndex].scrollIntoView({ block: 'nearest' });
    preview(items[sugIndex].dataset.name);
  }

  async function loadSug() {
    var text = $q.value.trim();
    if (text.length < 2) { closeSug(); return; }
    var mine = ++sugToken;
    try {
      var res = await fetch(AUTO + '?q=' + encodeURIComponent(text));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      if (mine !== sugToken) return;

      // Primero los nombres que empiezan por lo escrito y después los que lo contienen.
      var low = text.toLowerCase();
      var starts = [];
      var rest = [];
      data.data.forEach(function (n) { (n.toLowerCase().indexOf(low) === 0 ? starts : rest).push(n); });
      var names = starts.concat(rest).slice(0, 20);

      $list.textContent = '';
      $prev.textContent = '';
      sugIndex = -1;
      names.forEach(function (name, i) {
        var li = el('li');
        li.setAttribute('role', 'option');
        li.dataset.name = name;

        // Resalta la parte del nombre que coincide con lo escrito.
        var txt = el('span', 'txt');
        var at = name.toLowerCase().indexOf(low);
        if (at < 0) {
          txt.textContent = name;
        } else {
          txt.appendChild(document.createTextNode(name.slice(0, at)));
          txt.appendChild(el('b', null, name.slice(at, at + text.length)));
          txt.appendChild(document.createTextNode(name.slice(at + text.length)));
        }
        li.appendChild(txt);
        li.appendChild(el('span', 'go', 'Buscar ↵'));

        li.addEventListener('mousemove', function () { markSug(i, false); });
        li.addEventListener('click', function () { chooseSug(name); });
        $list.appendChild(li);
      });

      $foot.textContent = '';
      $foot.appendChild(el('span', null, names.length === 1 ? '1 sugerencia' : names.length + ' sugerencias'));
      $foot.appendChild(el('span', null, names.length > 8 ? 'Desplázate para ver más' : '↑ ↓ para moverte'));
      $list.scrollTop = 0;
      $sug.hidden = !names.length;
      if (names.length) preview(names[0]);
    } catch (err) {
      if (mine === sugToken) closeSug();
    }
  }

  $q.addEventListener('input', function () {
    exact = false;
    clearTimeout(timer);
    timer = setTimeout(function () { load(true); }, 350);
    clearTimeout(sugTimer);
    sugTimer = setTimeout(loadSug, 150);
  });

  $q.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { closeSug(); return; }
    if ($sug.hidden) return;
    if (ev.key === 'ArrowDown') { ev.preventDefault(); markSug(sugIndex + 1, true); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); markSug(sugIndex < 0 ? -1 : sugIndex - 1, true); }
    else if (ev.key === 'Enter') {
      if (sugIndex >= 0) { ev.preventDefault(); chooseSug($list.children[sugIndex].dataset.name); }
      else closeSug();
    }
  });

  $q.addEventListener('blur', closeSug);
  // Pulsar o arrastrar la barra de la lista no debe quitar el foco del buscador.
  $sug.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
  $sort.addEventListener('change', function () { load(true); });

  // Carga la página siguiente al acercarse al final.
  new IntersectionObserver(function (entries) {
    if (entries[0].isIntersecting && nextUrl && !loading) load(false);
  }, { rootMargin: '600px' }).observe($more);

  load(true);
})();
</script>
</body>
</html>
